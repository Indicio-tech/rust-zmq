[package]
name = "zmq-sys"
version = "0.12.0-indicio.0"
authors = [
    "a.rottmann@gmx.at",
    "erick.tryzelaar@gmail.com",
]
license = "MIT/Apache-2.0"
description = "Low-level bindings to the zeromq library"
keywords = ["ffi", "bindings"]
categories = ["external-ffi-bindings"]
repository = "https://github.com/erickt/rust-zmq"
build = "build/main.rs"
links = "zmq"

[features]
libsodium = ['libsodium-sys-stable']

[dependencies]
libc = "0.2.15"
# Windows link is broken on latest libsodium-sys-stable
# https://github.com/jedisct1/libsodium-sys-stable/issues/20
# [target.'cfg(target_os = "windows")'.dependencies]
libsodium-sys-stable = { version = "=1.21.4", optional = true }
# [target.'cfg(not(target_os = "windows"))'.dependencies]
# libsodium-sys-stable = { version = "1.0", optional = true }

[build-dependencies]
system-deps = "6"
zeromq-src = { version = "0.3.5+4.3.5"}
vcpkg = "0.2.15"


[package.metadata.system-deps]
libzmq = "4.1"


[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
rev = "4c1db68"

[package.metadata.vcpkg.target]
x86_64-pc-windows-msvc = { triplet = "x64-windows-static", dependencies = ["libsodium"] }